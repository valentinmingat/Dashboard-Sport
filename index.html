<!doctype html>
<html lang="fr" class="dark" data-theme="papaye">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <script>
      // Apply the saved color theme before the first paint (see src/lib/theme.js).
      try {
        var theme = localStorage.getItem('sport-track:theme')
        var backgrounds = { papaye: '#080808', lime: '#16202c', rose: '#080808' }
        if (backgrounds[theme]) {
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').setAttribute('content', backgrounds[theme])
        }
      } catch (e) {}
    </script>
    <meta name="description" content="Suivi de ton activité sportive au quotidien : séances, sommeil, suppléments et poids." />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sport Track" />
    <title>Sport Track</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
